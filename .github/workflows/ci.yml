name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: calcupost_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: calcupost_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      PULSE_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom, gd, bcmath, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked
      - run: npm ci --no-audit
      - run: npm run build
      - run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
        shell: bash
      - run: php tests/prepare-calculator-database.php
      - run: vendor/bin/phpunit
