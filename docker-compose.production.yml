services:
  calcupost_app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8104:80"
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
      LOG_CHANNEL: stderr
    volumes:
      - calcupost_storage:/var/www/html/storage

volumes:
  calcupost_storage:
