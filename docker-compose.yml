services:
  calcupost_app:
    build:
      context: .
      target: development
    container_name: calcupost_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8104:80"
    volumes:
      - .:/var/www/html
      - calcupost_vendor:/var/www/html/vendor
      - calcupost_node_modules:/var/www/html/node_modules
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8104

volumes:
  calcupost_vendor:
  calcupost_node_modules:
