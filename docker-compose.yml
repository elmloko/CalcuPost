services:
  calcupost_app:
    build: .
    container_name: calcupost_app
    restart: unless-stopped
    ports:
      - "8104:80"
    volumes:
      - .:/var/www/html
      - calcupost_vendor:/var/www/html/vendor
      - calcupost_node_modules:/var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8104
      - DB_CONNECTION=mysql
      - DB_HOST=172.65.10.108
      - DB_PORT=3306
      - DB_DATABASE=calcupost
      - DB_USERNAME=agbc
      - DB_PASSWORD=Correos.2026

volumes:
  calcupost_vendor:
  calcupost_node_modules:
